services:
  traccar-db-init:
    image: mariadb:11
    container_name: traccar-db-init
    restart: "no"
    env_file:
      - .env
    volumes:
      - ./init:/init:ro
    command: ["/bin/bash", "/init/10-init-traccar-db.sh"]
    networks:
      - proxy

  traccar:
    image: traccar/traccar:latest
    container_name: traccar
    depends_on:
      traccar-db-init:
        condition: service_completed_successfully
    env_file:
      - .env

    ports:
      # 管理端口（调试 / 直连运维）
      - "8048:8082"

      # 设备上报端口（必须暴露）
      - "${TRACCAR_DEVICE_PORT_RANGE:-5000-5300}:5000-5300"
      - "${TRACCAR_DEVICE_PORT_RANGE:-5000-5300}:5000-5300/udp"

    volumes:
      - ./data:/opt/traccar/data
      - ./logs:/opt/traccar/logs
      - ./conf/traccar.xml:/opt/traccar/conf/traccar.xml:ro

    environment:
      CONFIG_USE_ENVIRONMENT_VARIABLES: "true"
      DATABASE_DRIVER: com.mysql.cj.jdbc.Driver
      DATABASE_URL: ${TRACCAR_DATABASE_URL}
      DATABASE_USER: ${TRACCAR_DB_USER}
      DATABASE_PASSWORD: ${TRACCAR_DB_PASSWORD}

    networks:
      - proxy
    restart: unless-stopped

networks:
  proxy:
    external: true
