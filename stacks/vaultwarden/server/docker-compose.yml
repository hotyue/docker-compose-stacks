version: "3.8"

services:

  # ==============================
  # Vaultwarden 主服务
  # ==============================
  vaultwarden:
    image: ${VAULTWARDEN_IMAGE}
    container_name: ${VAULTWARDEN_CONTAINER_NAME}
    restart: unless-stopped

    # 可选：宿主机直连调试端口
    # NPM 反代不依赖该映射，直接走 proxy 网络访问容器 80 端口
    ports:
      - "${VAULTWARDEN_HTTP_PORT}:80"

    environment:
      TZ: ${TZ}

      # ===== 外部访问域名（必须与实际 HTTPS 访问地址完全一致）=====
      DOMAIN: ${VAULTWARDEN_DOMAIN}

      # ===== 数据库连接（运行期仅使用专用用户）=====
      DATABASE_URL: "mysql://${VAULTWARDEN_DB_USER}:${VAULTWARDEN_DB_PASSWORD}@${VAULTWARDEN_DB_HOST}:${VAULTWARDEN_DB_PORT}/${VAULTWARDEN_DB_NAME}"

      # ===== WebSocket（通知通道）=====
      # 官方默认启用，不设置 WEBSOCKET_ENABLED
      # 需要 Nginx Proxy Manager 启用 WebSocket Support

      # ===== 可选治理项（按需启用）=====
      # SIGNUPS_ALLOWED: "false"
      # INVITATIONS_ALLOWED: "true"
      # ADMIN_TOKEN: ${VAULTWARDEN_ADMIN_TOKEN}

    volumes:
      - ./data:/data
    networks:
      - proxy


networks:
  proxy:
    external: true
