version: "3.8"

services:

  # ============================================================================
  # Vaultwarden 主服务 (v1.3.1 治理版)
  # ============================================================================
  # 变更说明：
  # 1. 彻底移除了 vaultwarden-db-init 容器，改为 Pre-install Hook 机制。
  # 2. 数据库初始化由宿主机 Hook 通过 Docker Exec 钻入 MariaDB 容器完成。
  # 3. 解决了复杂密码导致的 DATABASE_URL 解析失败导致的 Access Denied 问题。
  # ============================================================================
  vaultwarden:
    image: ${VAULTWARDEN_IMAGE}
    container_name: ${VAULTWARDEN_CONTAINER_NAME}
    restart: unless-stopped

    # 可选：宿主机直连调试端口
    # NPM 反代建议直接访问容器 80 端口，该映射仅用于本地直连调试。
    ports:
      - "${VAULTWARDEN_HTTP_PORT}:80"

    environment:
      TZ: ${TZ}

      # ===== 外部访问域名 =====
      # 必须与浏览器实际访问地址完全一致（例如 https://vault.example.com）。
      DOMAIN: ${VAULTWARDEN_DOMAIN}

      # ===== 数据库连接 (核心治理) =====
      # 注意：如果密码包含特殊字符（如 @, #, :, /），可能会导致 Access Denied。
      # v1.3.1 建议：
      # 1. 在 .env 中确保 VAULTWARDEN_DB_PASSWORD 不包含破坏 URL 结构的特殊字符。
      # 2. 或者对密码进行 URL 编码（例如 @ 编码为 %40）。
      DATABASE_URL: "mysql://${VAULTWARDEN_DB_USER}:${VAULTWARDEN_DB_PASSWORD}@${VAULTWARDEN_DB_HOST}:${VAULTWARDEN_DB_PORT}/${VAULTWARDEN_DB_NAME}"

      # ===== WebSocket（通知通道）=====
      # 官方默认启用。使用 Nginx Proxy Manager 时需开启 "Websocket Support"。
      
      # ===== 可选治理项 =====
      # SIGNUPS_ALLOWED: "false"      # 是否允许新用户注册
      # INVITATIONS_ALLOWED: "true"   # 是否允许邀请注册
      # ADMIN_TOKEN: ${VAULTWARDEN_ADMIN_TOKEN} # 管理员面板 Token

    volumes:
      - ./data:/data
    networks:
      - proxy

networks:
  proxy:
    external: true