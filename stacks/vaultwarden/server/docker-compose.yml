version: "3.8"

services:

  # ============================================================================
  # Vaultwarden 主服务 (v1.3.2 生产对齐版)
  # ============================================================================
  # 变更说明：
  # 1. 彻底移除了一次性 init 容器，提升启动效率，消除僵尸容器。
  # 2. 数据库初始化由宿主机 Hook 在启动前通过 Docker Exec 完成。
  # 3. 针对复杂密码：建议在 .env 中对包含特殊符号的密码进行 URL 编码。
  # ============================================================================
  vaultwarden:
    image: ${VAULTWARDEN_IMAGE}
    container_name: ${VAULTWARDEN_CONTAINER_NAME}
    restart: unless-stopped

    # 可选：宿主机直连调试端口
    # 若仅通过 Nginx Proxy Manager (NPM) 访问，可考虑注释掉 ports 映射
    ports:
      - "${VAULTWARDEN_HTTP_PORT}:80"

    environment:
      TZ: ${TZ}

      # ===== 外部访问域名 =====
      # 必须与实际 HTTPS 访问地址完全一致（例如 https://vault.example.com）
      DOMAIN: ${VAULTWARDEN_DOMAIN}

      # ===== 数据库连接 (核心治理) =====
      # 注意：Vaultwarden 使用 Diesel 框架，若密码含 [# ? @ : /] 等 URL 分隔符，
      # 可能导致 Access Denied。此时需在 .env 中对密码进行 URL 编码，
      # 或在 Hook 中确保权限已通过 FLUSH PRIVILEGES 强制下发。
      DATABASE_URL: "mysql://${VAULTWARDEN_DB_USER}:${VAULTWARDEN_DB_PASSWORD}@${VAULTWARDEN_DB_HOST}:${VAULTWARDEN_DB_PORT}/${VAULTWARDEN_DB_NAME}"

      # ===== WebSocket（通知通道）=====
      # 官方默认启用。使用 NPM 时请务必开启 "Websocket Support"。

      # ===== 可选治理项 =====
      # SIGNUPS_ALLOWED: "false"      # 关闭注册
      # INVITATIONS_ALLOWED: "true"   # 允许邀请
      # ADMIN_TOKEN: ${VAULTWARDEN_ADMIN_TOKEN} # 管理面板 Token

    volumes:
      - ./data:/data
    networks:
      - proxy

networks:
  proxy:
    external: true