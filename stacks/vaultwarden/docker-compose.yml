version: "3.8"

services:

  # ============================================================================
  # Vaultwarden 主服务 (v1.3.6 终极生产版)
  # ============================================================================
  vaultwarden:
    image: ${VAULTWARDEN_IMAGE}
    container_name: ${VAULTWARDEN_CONTAINER_NAME}
    restart: unless-stopped

    ports:
      - "${VAULTWARDEN_HTTP_PORT}:80"

    environment:
      TZ: ${TZ}
      DOMAIN: ${VAULTWARDEN_DOMAIN}

      # ===== 数据库连接 (强制禁用 SQLite) =====
      # 1. 必须提供协议头 mysql:// 
      # 2. 这里的变量插值由 Docker 负责，能有效保护包含 $9 的强密码
      DATABASE_URL: mysql://${VAULTWARDEN_DB_USER}:${VAULTWARDEN_DB_PASSWORD}@${VAULTWARDEN_DB_HOST}:${VAULTWARDEN_DB_PORT}/${VAULTWARDEN_DB_NAME}
      
      # 3. 注入分立变量作为双重保险
      DB_TYPE: mysql
      DB_HOST: ${VAULTWARDEN_DB_HOST}
      DB_PORT: ${VAULTWARDEN_DB_PORT}
      DB_NAME: ${VAULTWARDEN_DB_NAME}
      DB_USER: ${VAULTWARDEN_DB_USER}
      DB_PW: ${VAULTWARDEN_DB_PASSWORD}

    volumes:
      - ./data:/data
    networks:
      - proxy

networks:
  proxy:
    external: true