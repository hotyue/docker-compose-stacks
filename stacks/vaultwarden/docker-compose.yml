version: "3.8"

services:

  # ============================================================================
  # Vaultwarden 主服务 (v1.3.4 终极对齐版)
  # ============================================================================
  # 变更说明：
  # 1. 强制对齐：使用 DATABASE_URL 确保 Vaultwarden 优先识别外部 MariaDB。
  # 2. 避坑指南：不使用分立变量，因为部分镜像版本会因找不到 DATABASE_URL 而回退 SQLite。
  # 3. 环境变量：使用 Docker 原生插值，确保 $9 等符号不被宿主机 Shell 预解析。
  # ============================================================================
  vaultwarden:
    image: ${VAULTWARDEN_IMAGE}
    container_name: ${VAULTWARDEN_CONTAINER_NAME}
    restart: unless-stopped

    # 宿主机直连调试端口
    ports:
      - "${VAULTWARDEN_HTTP_PORT}:80"

    environment:
      TZ: ${TZ}

      # ===== 外部访问域名 =====
      DOMAIN: ${VAULTWARDEN_DOMAIN}

      # ===== 数据库连接 (针对 SQLite 退化的强制修复) =====
      # 🌟 必须提供 DATABASE_URL 且协议头必须为 mysql:// 才能禁用内置 SQLite
      # 注意：如果密码包含 [# ? @ : /] 等 URL 关键字，请务必在 .env 中进行 URL 编码
      DATABASE_URL: mysql://${VAULTWARDEN_DB_USER}:${VAULTWARDEN_DB_PASSWORD}@${VAULTWARDEN_DB_HOST}:${VAULTWARDEN_DB_PORT}/${VAULTWARDEN_DB_NAME}
      
      # 辅助连接参数
      DATABASE_MAX_CONNS: 10
      DB_CONNECTION_RETRIES: 15

      # ===== WebSocket（通知通道）=====
      # 官方默认启用。使用 NPM 时请务必开启 "Websocket Support"。

      # ===== 可选治理项 =====
      # SIGNUPS_ALLOWED: "false"
      # INVITATIONS_ALLOWED: "true"
      # ADMIN_TOKEN: ${VAULTWARDEN_ADMIN_TOKEN}

    volumes:
      - ./data:/data
    networks:
      - proxy

networks:
  proxy:
    external: true