version: "3.8"

services:

  # ============================================================================
  # Vaultwarden 主服务 (v1.3.3 终极避坑治理版)
  # ============================================================================
  # 变更说明：
  # 1. 核心修复：放弃不稳定的 DATABASE_URL 拼接，改用分立变量 (DATABASE_METHOD, DB_PW 等)。
  # 2. 彻底规避：特殊字符（如 $9, #, @）在 URL 解析中导致的 Access Denied 报错。
  # 3. 架构优化：维持 Pre-install Hook 机制，确保数据库初始化与主服务完全解耦。
  # ============================================================================
  vaultwarden:
    image: ${VAULTWARDEN_IMAGE}
    container_name: ${VAULTWARDEN_CONTAINER_NAME}
    restart: unless-stopped

    # 宿主机直连调试端口
    ports:
      - "${VAULTWARDEN_HTTP_PORT}:80"

    environment:
      TZ: ${TZ}

      # ===== 外部访问域名 =====
      DOMAIN: ${VAULTWARDEN_DOMAIN}

      # ===== 数据库连接 (针对复杂密码的终极修复) =====
      # 🌟 不再拼接 URL，直接通过底层参数注入，确保密码原始性
      DATABASE_METHOD: mysql
      DB_TYPE: mysql
      DB_HOST: ${VAULTWARDEN_DB_HOST}
      DB_PORT: ${VAULTWARDEN_DB_PORT}
      DB_NAME: ${VAULTWARDEN_DB_NAME}
      DB_USER: ${VAULTWARDEN_DB_USER}
      DB_PW: ${VAULTWARDEN_DB_PASSWORD}
      
      # 连接池调优
      DATABASE_MAX_CONNS: 10
      DB_CONNECTION_RETRIES: 15

      # ===== WebSocket（通知通道）=====
      # 官方默认启用。使用 NPM 时请务必开启 "Websocket Support"。

      # ===== 可选治理项 =====
      # SIGNUPS_ALLOWED: "false"
      # INVITATIONS_ALLOWED: "true"
      # ADMIN_TOKEN: ${VAULTWARDEN_ADMIN_TOKEN}

    volumes:
      - ./data:/data
    networks:
      - proxy

networks:
  proxy:
    external: true