version: "3.8"

services:

  # ============================================================================
  # Vaultwarden 主服务 (v1.3.5 终极生产修复版)
  # ============================================================================
  vaultwarden:
    image: ${VAULTWARDEN_IMAGE}
    container_name: ${VAULTWARDEN_CONTAINER_NAME}
    restart: unless-stopped

    ports:
      - "${VAULTWARDEN_HTTP_PORT}:80"

    environment:
      TZ: ${TZ}
      DOMAIN: ${VAULTWARDEN_DOMAIN}

      # ===== 数据库连接 (彻底解决 Access Denied) =====
      # 🌟 方案：分立变量注入。直接将参数交给程序，不经过 DATABASE_URL 字符串解析
      # 这种方式能完美保留密码中的 $9, #, @ 等特殊字符
      DATABASE_METHOD: mysql
      DB_TYPE: mysql
      DB_HOST: ${VAULTWARDEN_DB_HOST}
      DB_PORT: ${VAULTWARDEN_DB_PORT}
      DB_NAME: ${VAULTWARDEN_DB_NAME}
      DB_USER: ${VAULTWARDEN_DB_USER}
      DB_PW: ${VAULTWARDEN_DB_PASSWORD}
      
      # 连接调优
      DATABASE_MAX_CONNS: 10
      DB_CONNECTION_RETRIES: 15

      # ===== 可选治理项 =====
      # SIGNUPS_ALLOWED: "false"
      # ADMIN_TOKEN: ${VAULTWARDEN_ADMIN_TOKEN}

    volumes:
      - ./data:/data
    networks:
      - proxy

networks:
  proxy:
    external: true