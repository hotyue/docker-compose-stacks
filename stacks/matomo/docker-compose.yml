services:
  # =========================
  # 初始化宿主 data 目录权限（兜底）
  # =========================
  matomo-init-perms:
    image: busybox:1.36
    container_name: matomo-init-perms
    command: >
      sh -c "
      echo '[init] fixing host data permissions';
      mkdir -p /data/tmp /data/config;
      chown -R 33:33 /data;
      chmod -R 755 /data;
      echo '[init] done';
      "
    volumes:
      - ./data:/data
    restart: "no"
    networks:
      - proxy

  # =========================
  # Matomo 主服务
  # =========================
  matomo:
    image: ${MATOMO_IMAGE}
    container_name: ${MATOMO_CONTAINER_NAME}
    depends_on:
      matomo-init-perms:
        condition: service_completed_successfully
    restart: unless-stopped
    ports:
      - "${MATOMO_HTTP_PORT}:80"
    environment:
      # ===== 数据库配置 =====
      MATOMO_DATABASE_HOST: ${MATOMO_DB_HOST}
      MATOMO_DATABASE_DBNAME: ${MATOMO_DB_NAME}
      MATOMO_DATABASE_USERNAME: ${MATOMO_DB_USER}
      MATOMO_DATABASE_PASSWORD: ${MATOMO_DB_PASSWORD}
      MATOMO_DATABASE_TABLES_PREFIX: ${MATOMO_DB_PREFIX}

      # ===== 运行时配置 =====
      TZ: ${TZ}

      # 禁用浏览器触发归档
      MATOMO_CONFIG_General__browser_archiving_disabled_enforce: "1"
    volumes:
      - ./data:/var/www/html
    networks:
      - proxy

  # =========================
  # 后台归档任务
  # =========================
  matomo-archive:
    image: ${MATOMO_IMAGE}
    container_name: matomo-archive
    depends_on:
      matomo:
        condition: service_started
    restart: unless-stopped
    entrypoint: >
      sh -c "
      while true; do
        php /var/www/html/console core:archive --url=${MATOMO_BASE_URL};
        sleep 3600;
      done
      "
    environment:
      TZ: ${TZ}
    volumes:
      - ./data:/var/www/html
    networks:
      - proxy

networks:
  proxy:
    external: true
