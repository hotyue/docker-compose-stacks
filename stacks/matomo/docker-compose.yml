services:
  # =========================
  # Matomo 主服务
  # =========================
  matomo:
    image: ${MATOMO_IMAGE}
    container_name: ${MATOMO_CONTAINER_NAME}
    restart: unless-stopped
    ports:
      - "${MATOMO_HTTP_PORT}:80"
    environment:
      # ===== 数据库配置 =====
      MATOMO_DATABASE_HOST: ${MATOMO_DB_HOST}
      MATOMO_DATABASE_DBNAME: ${MATOMO_DB_NAME}
      MATOMO_DATABASE_USERNAME: ${MATOMO_DB_USER}
      MATOMO_DATABASE_PASSWORD: ${MATOMO_DB_PASSWORD}
      MATOMO_DATABASE_TABLES_PREFIX: ${MATOMO_DB_PREFIX}

      # ===== 运行时配置 =====
      TZ: ${TZ}

      # 禁用浏览器触发归档（官方支持）
      MATOMO_CONFIG_General__browser_archiving_disabled_enforce: "1"
    volumes:
      # ⚠️ 环境兼容方案：直接覆盖 Matomo 工作目录
      - ./data:/var/www/html
    networks:
      - proxy

  # =========================
  # 后台归档任务（Archive Worker）
  # =========================
  matomo-archive:
    image: ${MATOMO_IMAGE}
    container_name: matomo-archive
    depends_on:
      - matomo
    restart: unless-stopped
    entrypoint: >
      sh -c "
      while true; do
        php /var/www/html/console core:archive --url=${MATOMO_BASE_URL};
        sleep 3600;
      done
      "
    environment:
      TZ: ${TZ}
    volumes:
      # 与主服务共享同一数据目录
      - ./data:/var/www/html
    networks:
      - proxy

# =========================
# 外部网络
# =========================
networks:
  proxy:
    external: true
