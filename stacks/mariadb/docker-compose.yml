services:
  # ------------------------------------------------------------
  # 初始化数据目录权限（保持不变）
  # ------------------------------------------------------------
  init-perms:
    image: busybox:1.36
    command: sh -c 'mkdir -p /data && chmod 775 /data'
    volumes:
      - ./data:/data
    networks:
      - proxy
    restart: "no"

  # ------------------------------------------------------------
  # MariaDB 主服务
  # ------------------------------------------------------------
  mariadb:
    image: mariadb:11
    container_name: mariadb

    depends_on:
      init-perms:
        condition: service_completed_successfully

    env_file:
      - .env

    ports:
      - "${MARIADB_PORT:-3306}:3306"

    # ----------------------------------------------------------
    # 【关键修复点】
    # command 必须是数组（list），不能直接写多行参数
    # ----------------------------------------------------------
    command:
      - --max_allowed_packet=256M
      # ↑ 原有参数：保留，兼容 Matomo 大查询

      - --innodb-buffer-pool-size=512M
      # ↑ 新增：限制 InnoDB 缓冲池，防止数据库吃满整机内存

      - --innodb-buffer-pool-instances=1
      # ↑ 新增：小内存场景，避免 buffer pool 分片浪费

      - --innodb-log-buffer-size=64M
      # ↑ 新增：兼顾 Traccar 高频写入与内存占用

      - --max-connections=150
      # ↑ 新增：防止高并发时连接数失控

      - --table-open-cache=400
      # ↑ 新增：限制表缓存，控制 metadata 内存

      - --tmp-table-size=64M
      - --max-heap-table-size=64M
      # ↑ 新增：限制内存临时表，避免统计查询炸内存

    volumes:
      - ./data:/var/lib/mysql
      - ./docker-entrypoint-initdb.d:/docker-entrypoint-initdb.d:ro

    networks:
      - proxy

    restart: unless-stopped

networks:
  proxy:
    external: true
