version: "3.9"

services:
  # ============================================================================
  # 哪吒监控面板 (Main Server)
  # 使用内置 SQLite 数据库
  # ============================================================================
  nezha:
    image: ghcr.io/nezhahq/nezha:latest
    container_name: nezha-server
    restart: unless-stopped

    ports:
      # 映射面板端口
      - "${NEZHA_HTTP_PORT:-8008}:8008"

    volumes:
      # 挂载数据目录
      # SQLite 数据库文件 (sqlite.db) 将自动生成在此目录下
      - ./data:/dashboard/data

    environment:
      # 仅保留时区配置
      TZ: ${TZ:-Asia/Shanghai}

    networks:
      - proxy

networks:
  proxy:
    external: true