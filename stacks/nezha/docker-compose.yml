version: "3.8"

services:
  nezha:
    image: ghcr.io/nezhahq/nezha:latest
    container_name: nezha-dashboard
    restart: unless-stopped
    
    ports:
      - "${NEZHA_HTTP_PORT:-8008}:8008"

    volumes:
      - ./data:/dashboard/data

    environment:
      TZ: ${TZ}
      DEBUG: "false"
      
      # 🇨🇳 语言设置
      NZ_LANGUAGE: zh-CN
      
      # 🏷️ 站点名称 (映射我们定义的变量)
      NZ_SITE_NAME: ${NEZHA_SITE_NAME:-Nezha Monitoring}
      
      # OAuth 配置
      GH_CLIENT_ID: ${NEZHA_OAUTH_CLIENT_ID}
      GH_CLIENT_SECRET: ${NEZHA_OAUTH_CLIENT_SECRET}

    networks:
      - proxy

networks:
  proxy:
    external: true