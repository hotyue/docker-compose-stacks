version: "3.8"

services:
  nezha:
    image: ghcr.io/nezhahq/nezha:latest
    container_name: nezha-dashboard
    restart: unless-stopped
    
    ports:
      - "${NEZHA_HTTP_PORT:-8008}:8008"

    volumes:
      - ./data:/dashboard/data

    environment:
      TZ: ${TZ}
      DEBUG: "false"
      
      # 尝试设置默认语言（仅在新生成配置时尝试，不强求）
      NZ_LANGUAGE: zh-CN
      
      # OAuth 必须配置
      GH_CLIENT_ID: ${NEZHA_OAUTH_CLIENT_ID}
      GH_CLIENT_SECRET: ${NEZHA_OAUTH_CLIENT_SECRET}

    networks:
      - proxy

networks:
  proxy:
    external: true